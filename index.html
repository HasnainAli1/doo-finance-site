<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>doo.FINANCE — Your Odoo partner for accounting and finance</title>
<meta name="description" content="Odoo Gold Partner for accounting and finance: bookkeeping, payroll, tax returns, reporting, migration and German accounting integrations, in 10 countries.">
<link rel="icon" type="image/png" href="assets/doo-finance-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>

body{margin:0;background:#FFFFFF}
a{color:#8A3F7B}a:hover{color:#6E2F62}

/* ---------- keyframes ---------- */
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.15)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,30px) scale(.9)}}
@keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-50px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px)}60%{transform:translateY(-18px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes words{0%,18%{transform:translateY(0)}25%,43%{transform:translateY(-25%)}50%,68%{transform:translateY(-50%)}75%,93%{transform:translateY(-75%)}100%{transform:translateY(0)}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes shine{0%{transform:translateX(-120%) skewX(-20deg)}60%,100%{transform:translateX(220%) skewX(-20deg)}}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
@keyframes gradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes tilt{from{opacity:0;transform:perspective(1400px) rotateX(18deg) translateY(60px)}to{opacity:1;transform:perspective(1400px) rotateX(0) translateY(0)}}
@keyframes underline{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@property --n750{syntax:'<integer>';initial-value:0;inherits:false}
@property --n10{syntax:'<integer>';initial-value:0;inherits:false}
@keyframes c750{to{--n750:750}}
@keyframes c10{to{--n10:10}}

/* ---------- utilities ---------- */
.a-rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.a-pop{animation:pop .6s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.55s}.d5{animation-delay:.7s}.d6{animation-delay:.9s}.d7{animation-delay:1.1s}.d8{animation-delay:1.3s}.d9{animation-delay:1.5s}.d10{animation-delay:1.7s}
.blob1{animation:drift1 14s ease-in-out infinite}
.blob2{animation:drift2 18s ease-in-out infinite}
.blob3{animation:drift3 12s ease-in-out infinite}
.dot-bounce{animation:bounce 2.4s cubic-bezier(.3,.6,.3,1) infinite}
.bob{animation:bob 4s ease-in-out infinite}
.bob2{animation:bob 5s ease-in-out infinite .8s}
.bar{transform-origin:bottom;animation:grow 1s cubic-bezier(.2,.7,.2,1) both}
.line-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:draw 2s ease-out 1.2s forwards}
.word-wheel{animation:words 10s cubic-bezier(.7,0,.3,1) infinite}
.marquee{animation:marquee 30s linear infinite}
.marquee:hover{animation-play-state:paused}
.shine{position:relative;overflow:hidden}
.shine::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 3.5s ease-in-out infinite}
.pin::before{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:pulse 2s ease-out infinite}
.grad{background:linear-gradient(120deg,#A0508F,#7E3C70,#C46A8E,#F97243,#A0508F);background-size:300% 300%;animation:gradient 12s ease infinite}
.dash{animation:tilt 1.2s cubic-bezier(.2,.7,.2,1) .6s both}
.uline{transform-origin:left;animation:underline .8s cubic-bezier(.2,.7,.2,1) 1.2s both}
.count750{animation:c750 2.4s cubic-bezier(.2,.7,.2,1) .4s both;counter-reset:n var(--n750)}
.count750::before{content:counter(n)}
.count10{animation:c10 2s cubic-bezier(.2,.7,.2,1) .4s both;counter-reset:n var(--n10)}
.count10::before{content:counter(n)}

/* hover life */
.nav-a{position:relative;color:#4A4F59;text-decoration:none}
.nav-a::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;border-radius:2px;background:#F97243;transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
.nav-a:hover{color:#262A36}.nav-a:hover::after{transform:scaleX(1)}
.tile{transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s ease,background-color .25s}
.tile:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(160,80,143,.16);background:#FFFFFF}
.tile .ico{transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.tile:hover .ico{transform:rotate(-8deg) scale(1.12)}
.card-h{transition:transform .25s ease,box-shadow .25s ease}
.card-h:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(38,42,54,.10)}
.btn-p{transition:transform .2s ease,box-shadow .2s ease}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(160,80,143,.35)}

/* scroll-driven reveals (modern browsers); content stays visible elsewhere */
@supports (animation-timeline: view()){
  .reveal{animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 28%}
  .reveal-pop{animation:pop linear both;animation-timeline:view();animation-range:entry 10% cover 30%}
  .progress-line{transform-origin:top;animation:grow linear both;animation-timeline:view();animation-range:entry 20% cover 60%}
}

/* ===== final round: shared ===== */
.eyebrow{margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:1.4px;color:#8A3F7B}
.dot-grid{position:absolute;inset:0;background-image:radial-gradient(#E7DCE4 1.2px,transparent 1.4px);background-size:22px 22px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);opacity:.8}
.tick{flex:none;width:20px;height:20px;border-radius:50%;background:var(--c,#0E9F8E);position:relative;margin-top:1px}
.tick::after{content:"";position:absolute;left:7px;top:4px;width:5px;height:9px;border:solid #FFFFFF;border-width:0 2.2px 2.2px 0;transform:rotate(45deg)}
.sample-badge{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px dashed rgba(255,255,255,.4);color:#F3D27A}
@property --n12{syntax:'<integer>';initial-value:0;inherits:false}
@keyframes c12{to{--n12:12}}
.count12{animation:c12 2s cubic-bezier(.2,.7,.2,1) .4s both;counter-reset:n var(--n12)}
.count12::before{content:counter(n)}

/* hero floating app icons */
.hero-app{position:absolute;width:64px;height:64px;border-radius:18px;background:#FFFFFF;box-shadow:0 14px 34px rgba(38,42,54,.14);display:flex;align-items:center;justify-content:center;z-index:1;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.hero-app img{width:46px;height:46px}
.hero-app:hover{transform:scale(1.15) rotate(-6deg)}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(4deg)}}
.fl1{animation:floaty 6s ease-in-out infinite}.fl2{animation:floaty 7s ease-in-out infinite .6s}.fl3{animation:floaty 5.5s ease-in-out infinite 1.2s}.fl4{animation:floaty 6.5s ease-in-out infinite .3s}.fl5{animation:floaty 7.5s ease-in-out infinite .9s}.fl6{animation:floaty 6.2s ease-in-out infinite 1.5s}

/* stats */
.stat{background:var(--bg);border-radius:20px;padding:26px 24px;position:relative;overflow:hidden;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.stat:hover{transform:translateY(-4px) rotate(-.6deg)}
.stat::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--c);opacity:.12;transition:transform .5s}
.stat:hover::after{transform:scale(1.6)}
.stat-num{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1;color:var(--c)}
.stat-lbl{margin-top:10px;color:#3F4450;font-weight:500;font-size:15px}

/* apps */
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.app-tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 8px 14px;border-radius:18px;border:1px solid transparent;background:transparent;font:600 13.5px Inter,sans-serif;color:#262A36;cursor:pointer;transition:transform .3s cubic-bezier(.2,.7,.2,1),background-color .25s,box-shadow .25s,border-color .25s}
.app-ico{width:72px;height:72px;border-radius:20px;background:#FFFFFF;box-shadow:0 6px 16px rgba(38,42,54,.10),0 0 0 1px rgba(38,42,54,.05);display:flex;align-items:center;justify-content:center;transition:transform .45s cubic-bezier(.3,1.6,.5,1),box-shadow .3s}
.app-ico img{width:54px;height:54px}
.app-ico.big{width:84px;height:84px;border-radius:24px}
.app-ico.big img{width:64px;height:64px}
.app-tile:hover .app-ico{transform:translateY(-6px) rotate(-7deg) scale(1.06);box-shadow:0 16px 30px color-mix(in srgb,var(--glow) 35%,transparent),0 0 0 1px rgba(38,42,54,.05)}
.app-tile.is-on{background:#FFFFFF;border-color:color-mix(in srgb,var(--glow) 40%,#FFFFFF);box-shadow:0 18px 40px color-mix(in srgb,var(--glow) 22%,transparent)}
.app-tile.is-on .app-ico{transform:scale(1.06);box-shadow:0 0 0 3px var(--glow),0 14px 30px color-mix(in srgb,var(--glow) 35%,transparent)}
.app-tile.is-on::after{content:"";position:absolute;bottom:6px;left:50%;width:18px;height:4px;margin-left:-9px;border-radius:4px;background:var(--glow)}
.app-panel{position:relative;border-radius:26px;padding:30px;background:#FFFFFF;border:1px solid #EEE7EC;box-shadow:0 30px 70px rgba(38,42,54,.10);overflow:hidden;transition:box-shadow .4s}
.app-panel-bg{position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:50%;background:var(--glow);opacity:.14;filter:blur(10px);transition:background-color .5s}
.app-points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.app-points li{display:flex;gap:12px;font-size:15.5px;color:#3F4450;animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.app-points li:nth-child(2){animation-delay:.07s}.app-points li:nth-child(3){animation-delay:.14s}.app-points li:nth-child(4){animation-delay:.21s}
.app-points .tick{--c:var(--glow)}
.app-flow-tag{font-size:12px;font-weight:700;letter-spacing:.8px;color:#5F6470;text-transform:uppercase}
.app-chip{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;background:#F6F3F5;font-size:13.5px;font-weight:600}
.app-chip img{width:26px;height:26px;border-radius:8px;background:#FFFFFF}

/* flow */
.flow{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:20px 0}
.flow-track{position:absolute;left:10%;right:10%;top:58px;height:4px;border-radius:4px;background:repeating-linear-gradient(90deg,#BFE9E3 0 10px,transparent 10px 18px);overflow:visible}
.packet{position:absolute;top:-5px;left:0;width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 5px rgba(255,255,255,.9),0 4px 12px rgba(0,0,0,.2);animation:travel 4.8s cubic-bezier(.55,.1,.45,.9) infinite}
@keyframes travel{0%{left:0;opacity:0}8%{opacity:1}92%{opacity:1}100%{left:100%;opacity:0}}
.flow-step{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;z-index:1}
.flow-ico{width:84px;height:84px;border-radius:24px;background:#FFFFFF;box-shadow:0 12px 28px rgba(14,159,142,.18),0 0 0 1px rgba(14,159,142,.15);display:flex;align-items:center;justify-content:center;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.flow-ico img{width:60px;height:60px}
.flow-step:hover .flow-ico{transform:translateY(-8px) scale(1.08)}
.flow-step strong{font-size:16px}
.flow-step span:last-child{font-size:14px;color:#5F6470}

/* services */
.seg{display:inline-flex;padding:5px;border-radius:14px;background:#FFFFFF;border:1px solid #EEE7EC;box-shadow:0 6px 18px rgba(38,42,54,.06)}
.seg-btn{height:42px;padding:0 18px;border:0;border-radius:10px;background:transparent;font:700 14px Inter,sans-serif;color:#4A4F59;cursor:pointer;transition:background-color .25s,color .25s}
.seg-btn.is-on{background:#A0508F;color:#FFFFFF}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.svc{position:relative;display:flex;flex-direction:column;gap:12px;padding:24px;border-radius:22px;background:#FFFFFF;border:1px solid #EEE7EC;overflow:hidden;animation:pop .5s cubic-bezier(.2,.7,.2,1) both;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.svc::before{content:"";position:absolute;inset:0;background:var(--bg);transform:translateY(101%);transition:transform .45s cubic-bezier(.2,.7,.2,1);z-index:0}
.svc>*{position:relative;z-index:1}
.svc:hover{transform:translateY(-6px);box-shadow:0 24px 50px color-mix(in srgb,var(--c) 22%,transparent)}
.svc:hover::before{transform:none}
.svc-top{display:flex;justify-content:space-between;align-items:center}
.svc-ico{width:60px;height:60px;border-radius:18px;background:#FFFFFF;box-shadow:0 6px 16px rgba(38,42,54,.10);display:flex;align-items:center;justify-content:center;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.svc-ico img{width:44px;height:44px}
.svc:hover .svc-ico{transform:rotate(-10deg) scale(1.1)}
.svc-kind{font-size:11.5px;font-weight:800;letter-spacing:1px;color:var(--c);text-transform:uppercase}
.svc h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.3px}
.svc p{margin:0;color:#4A4F59;font-size:15px}
.svc-more{display:flex;flex-wrap:wrap;gap:6px}
.svc-tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,#FFFFFF);color:color-mix(in srgb,var(--c) 75%,#000000)}
.svc-link{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-weight:700;text-decoration:none;color:color-mix(in srgb,var(--c) 80%,#000000)}
.svc-link svg{transition:transform .25s}
.svc:hover .svc-link svg{transform:translateX(5px)}

/* data */
.panel{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:24px;backdrop-filter:blur(6px);transition:border-color .3s,transform .3s}
.panel:hover{border-color:rgba(249,160,126,.45);transform:translateY(-3px)}
.panel-h{margin:0 0 18px;font-size:16px;font-weight:700;color:#FFFFFF}
.bars{display:flex;align-items:flex-end;gap:12px;height:240px;padding-top:24px}
.bar-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;position:relative;cursor:default}
.bar-fill{width:100%;border-radius:8px 8px 3px 3px;transform-origin:bottom;animation:grow 1s cubic-bezier(.2,.7,.2,1) both;transition:filter .2s,transform .2s}
.bar-col:hover .bar-fill{filter:brightness(1.25);transform:scaleX(1.06)}
.bar-val{position:absolute;bottom:calc(100% - 2px);font-size:12px;font-weight:800;color:#FFFFFF;background:#F97243;padding:3px 8px;border-radius:6px;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none}
.bar-col:hover .bar-val{opacity:1;transform:none}
.bar-yr{font-size:12px;color:#B9BCC6}
.donut-seg{transition:stroke-width .2s}
.donut-seg:hover{stroke-width:20}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;flex:1;min-width:150px}
.legend li{display:flex;align-items:center;gap:10px;font-size:14px;color:#D9DBE1}
.legend li span{width:12px;height:12px;border-radius:4px}
.legend li strong{margin-left:auto;color:#FFFFFF}
.kpi{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;font-size:14px;color:#D9DBE1}
.kpi strong{color:#FFFFFF;font-size:18px}
.kpi-bar{grid-column:1 / -1;height:8px;border-radius:8px;background:#2A2D36;overflow:hidden}
.kpi-bar span{display:block;height:100%;border-radius:8px;background:#A0508F;transform-origin:left;animation:barGrow 1.4s cubic-bezier(.2,.7,.2,1) .4s both}
.hbar{display:grid;grid-template-columns:auto 96px 1fr 34px;gap:10px;align-items:center;font-size:14px;color:#D9DBE1}
.hbar strong{color:#FFFFFF;text-align:right}
.hbar-track{height:10px;border-radius:10px;background:#2A2D36;overflow:hidden}
.hbar-track span{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#A0508F,#F97243);transform-origin:left;animation:barGrow 1.2s cubic-bezier(.2,.7,.2,1) both}
.panel-wide{grid-column:span 2}

/* estimator */
.field-lbl{margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:.6px;color:#5F6470;text-transform:uppercase}
.src-chip{height:44px;padding:0 16px;border-radius:12px;border:1.5px solid #E7DCE4;background:#FFFFFF;font:700 14px Inter,sans-serif;color:#262A36;cursor:pointer;transition:transform .2s,border-color .2s,background-color .2s,color .2s}
.src-chip:hover{transform:translateY(-2px);border-color:#A0508F}
.src-chip.is-on{background:#262A36;border-color:#262A36;color:#FFFFFF}
.stepper-row{display:flex;flex-wrap:wrap;gap:14px}
.stepper{flex:1 1 140px}
.stepper-ctl{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 6px;border-radius:14px;background:#FFFFFF;border:1.5px solid #E7DCE4}
.stepper-ctl button{width:40px;height:40px;border-radius:10px;border:0;background:#F6EEF4;color:#8A3F7B;font:800 20px Inter,sans-serif;cursor:pointer;transition:background-color .2s,transform .15s}
.stepper-ctl button:hover{background:#A0508F;color:#FFFFFF}
.stepper-ctl button:active{transform:scale(.9)}
.stepper-ctl strong{font-size:20px}
.est-card{display:flex;flex-direction:column;gap:22px;padding:30px;border-radius:26px;background:#FFFFFF;box-shadow:0 30px 70px rgba(122,47,94,.14);border:1px solid #F1E6EE}
.est-weeks{margin:4px 0 0;font-size:22px;font-weight:700;color:#4A4F59}
.est-weeks span{font-size:72px;font-weight:800;letter-spacing:-3px;color:#A0508F;line-height:1;display:inline-block;animation:pop .45s cubic-bezier(.2,.7,.2,1)}
.est-from{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-radius:14px;background:#F6F3F5;font-weight:800;font-size:14px}
.est-from img{width:38px;height:38px;border-radius:10px;background:#FFFFFF}
.est-phases{display:flex;gap:6px;height:64px}
.est-phase{min-width:0;border-radius:12px;padding:8px 10px;color:#FFFFFF;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:flex .5s cubic-bezier(.2,.7,.2,1)}
.est-phase span{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.95}
.est-phase strong{font-size:15px}
.est-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.est-list li{display:flex;gap:10px;font-size:15px;color:#3F4450}

/* industries */
.ind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.ind{position:relative;display:flex;flex-direction:column;gap:10px;padding:22px;border-radius:22px;background:var(--bg);overflow:hidden;min-height:250px;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.ind::after{content:"";position:absolute;left:-20%;bottom:-60%;width:140%;height:80%;border-radius:50%;background:var(--c);opacity:.10;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.ind:hover{transform:translateY(-8px) rotate(-.8deg);box-shadow:0 26px 50px color-mix(in srgb,var(--c) 25%,transparent)}
.ind:hover::after{transform:translateY(-40%)}
.ind>*{position:relative;z-index:1}
.ind-head{display:flex;justify-content:space-between;align-items:center}
.ind-num{font-size:13px;font-weight:800;color:var(--c)}
.ind-apps{display:flex}
.ind-apps img{width:34px;height:34px;border-radius:10px;background:#FFFFFF;padding:3px;box-shadow:0 4px 10px rgba(38,42,54,.12);margin-left:-8px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.ind:hover .ind-apps img:nth-child(1){transform:translateY(-4px) rotate(-8deg)}
.ind:hover .ind-apps img:nth-child(2){transform:translateY(-6px)}
.ind:hover .ind-apps img:nth-child(3){transform:translateY(-4px) rotate(8deg)}
.ind h3{margin:6px 0 0;font-size:21px;font-weight:800;color:#262A36}
.ind p{margin:0;font-size:14.5px;color:#3F4450}
.ind-tags{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px}
.ind-tags span{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.75);color:#262A36}

/* quiz */
.quiz{width:100%;max-width:720px;padding:32px;border-radius:26px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:18px;align-items:center}
.quiz-progress{width:100%;height:6px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden}
.quiz-progress span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#F97243,#FBC06A);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.quiz-step{margin:0;font-size:13px;font-weight:800;letter-spacing:1px;color:#F9A07E;text-transform:uppercase}
.quiz-q{margin:0;font-size:26px;font-weight:800;letter-spacing:-.5px;animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
.quiz-opts{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.quiz-opt{min-height:60px;padding:12px 16px;border-radius:16px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#FFFFFF;font:600 15px Inter,sans-serif;cursor:pointer;animation:pop .45s cubic-bezier(.2,.7,.2,1) both;transition:background-color .2s,border-color .2s,transform .2s}
.quiz-opt:nth-child(2){animation-delay:.06s}.quiz-opt:nth-child(3){animation-delay:.12s}.quiz-opt:nth-child(4){animation-delay:.18s}
.quiz-opt:hover{background:#FFFFFF;color:#4A1F45;border-color:#FFFFFF;transform:translateY(-3px)}
.quiz-reset{height:50px;padding:0 20px;border-radius:12px;border:1.5px solid rgba(255,255,255,.4);background:transparent;color:#FFFFFF;font:700 15px Inter,sans-serif;cursor:pointer}
.quiz-reset:hover{background:rgba(255,255,255,.12)}

/* testimonial trust tiles */
.trust{padding:22px;border-radius:20px;background:#FFFFFF;border:1px solid #EEE7EC;display:flex;flex-direction:column;gap:4px;transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.trust:hover{transform:translateY(-4px);box-shadow:0 16px 34px color-mix(in srgb,var(--c) 22%,transparent)}
.trust strong{font-size:34px;font-weight:800;letter-spacing:-1px;color:var(--c)}
.trust span{font-size:14px;color:#4A4F59}

/* posts */
.post{border-radius:22px;overflow:hidden;background:#FFFFFF;border:1px solid #EEE7EC;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.post:hover{transform:translateY(-6px);box-shadow:0 24px 50px rgba(38,42,54,.12)}
.post-cover{position:relative;aspect-ratio:16 / 9;display:flex;align-items:center;justify-content:center;gap:14px;overflow:hidden}
.post-cover img{width:64px;height:64px;border-radius:18px;background:#FFFFFF;padding:6px;box-shadow:0 10px 24px rgba(0,0,0,.18);transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.post:hover .post-cover img:nth-child(1){transform:translateY(-8px) rotate(-8deg)}
.post:hover .post-cover img:nth-child(2){transform:translateY(-12px)}
.post:hover .post-cover img:nth-child(3){transform:translateY(-8px) rotate(8deg)}
.post-date-big{display:flex;flex-direction:column;align-items:center;justify-content:center;width:110px;height:110px;border-radius:24px;background:#FFFFFF;color:#C4501F;font-weight:800;font-size:16px;letter-spacing:2px;box-shadow:0 12px 28px rgba(0,0,0,.15);transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.post-date-big b{font-size:46px;letter-spacing:-1px;line-height:1;color:#262A36}
.post:hover .post-date-big{transform:rotate(-6deg) scale(1.06)}
.post-flag{position:absolute;top:14px;left:14px;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.9);font-size:12px;font-weight:700}
.post-city{font-size:46px;font-weight:800;letter-spacing:-1.5px;color:#FFFFFF}
.post-body{padding:22px;display:flex;flex-direction:column;gap:8px}
.post-meta{font-size:13px;color:#5F6470}
.post-meta b{color:#8A3F7B}
.post h3{margin:0;font-size:19px;line-height:1.35;font-weight:800}
.post h3 a{color:#262A36;text-decoration:none;background:linear-gradient(#F97243,#F97243) no-repeat left bottom/0% 2px;transition:background-size .35s}
.post:hover h3 a{background-size:100% 2px}

@media (max-width: 900px){
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flow-track{display:none}
  .panel-wide{grid-column:auto}
}





/* ---------- motion ---------- */
@keyframes dfde-rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes dfde-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes dfde-shine{0%{transform:translateX(-140%) skewX(-18deg)}55%,100%{transform:translateX(260%) skewX(-18deg)}}
@keyframes dfde-glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.85;transform:scale(1.08)}}
@keyframes dfde-dash{to{stroke-dashoffset:-24}}
@keyframes dfde-flow{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes dfde-pulse{0%{box-shadow:0 0 0 0 rgba(113,75,103,.45)}100%{box-shadow:0 0 0 14px rgba(113,75,103,0)}}
@keyframes dfde-drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-30px)}}
@keyframes dfde-stripe{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.dfde-in{animation:dfde-rise .8s cubic-bezier(.2,.7,.2,1) both}
@supports (animation-timeline: view()){
  .dfde-reveal{animation:dfde-rise linear both;animation-timeline:view();animation-range:entry 0% cover 25%}
}

/* ---------- section shell ---------- */
.dfde{position:relative;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#25232A;background:linear-gradient(180deg,#F1EAF3 0%,#FAF7FB 38%,#FFFFFF 100%)}
.dfde-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(113,75,103,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(113,75,103,.07) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 55%);mask-image:linear-gradient(180deg,#000 0%,transparent 55%)}
.dfde-light{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;animation:dfde-drift 18s ease-in-out infinite}
.dfde-wrap{position:relative;max-width:1200px;margin:0 auto;padding:0 32px}

/* header */
.dfde-head{display:flex;flex-wrap:wrap;align-items:center;gap:32px}
.dfde-partner{position:relative;flex:none;width:220px;padding:18px 22px;border-radius:20px;background:#FFFFFF;box-shadow:0 18px 44px rgba(53,35,63,.14),0 0 0 1px rgba(113,75,103,.08);overflow:hidden;animation:dfde-float 6s ease-in-out infinite}
.dfde-partner img{display:block;width:100%;height:auto;position:relative;z-index:1}
.dfde-partner::after{content:"";position:absolute;inset:0;z-index:2;width:45%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:dfde-shine 4.5s ease-in-out infinite;pointer-events:none}
.dfde-partner-halo{position:absolute;inset:-30px;z-index:0;border-radius:50%;background:radial-gradient(circle,rgba(228,169,0,.18),transparent 65%);animation:dfde-glow 4s ease-in-out infinite}
.dfde-divider{width:1px;align-self:stretch;min-height:120px;background:linear-gradient(180deg,transparent,rgba(113,75,103,.35),transparent)}
.dfde-flagbar{display:flex;width:84px;height:5px;border-radius:5px;overflow:hidden;margin-bottom:16px;transform-origin:left;animation:dfde-stripe .9s cubic-bezier(.2,.7,.2,1) .3s both}
.dfde-flagbar span{flex:1}
.dfde-eyebrow{margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:1.4px;color:#714B67;text-transform:uppercase}
.dfde-h2{margin:0 0 12px;font-size:52px;line-height:1.05;font-weight:800;letter-spacing:-1.6px;color:#25232A}
.dfde-h2 em{font-style:normal;background:linear-gradient(90deg,#714B67,#A35A8E,#714B67);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:dfde-flow-text 6s ease-in-out infinite}
@keyframes dfde-flow-text{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
.dfde-sub{margin:0 0 12px;font-size:20px;font-weight:600;color:#35233F;max-width:720px}
.dfde-desc{margin:0;font-size:16.5px;line-height:1.6;color:#4E4756;max-width:720px}
.dfde-pos{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.dfde-pos span{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:#FFFFFF;border:1px solid #E6DAE8;font-size:13px;font-weight:600;color:#35233F}
.dfde-pos span::before{content:"";width:6px;height:6px;border-radius:50%;background:#714B67}

/* platform cards */
.dfde-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.dfde-card{position:relative;display:flex;flex-direction:column;gap:12px;min-height:250px;padding:22px;border-radius:18px;background:#FFFFFF;border:1px solid #ECE3EE;box-shadow:0 4px 14px rgba(53,35,63,.06);overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:inherit;animation:dfde-rise .6s cubic-bezier(.2,.7,.2,1) both;transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s ease,border-color .3s ease}
.dfde-card:hover,.dfde-card:focus-visible,.dfde-card.is-on{transform:translateY(-6px);border-color:rgba(113,75,103,.45);box-shadow:0 22px 46px rgba(113,75,103,.18),0 0 0 3px rgba(113,75,103,.10);outline:none}
.dfde-logo{height:76px;display:flex;align-items:center;justify-content:flex-start}
.dfde-logo img{max-height:64px;max-width:170px;width:auto;height:auto;object-fit:contain;transition:transform .3s ease}
.dfde-card:hover .dfde-logo img,.dfde-card:focus-visible .dfde-logo img{transform:scale(1.05)}
.dfde-wordmark{display:flex;flex-direction:column;justify-content:center;transition:transform .3s ease;transform-origin:left center}
.dfde-card:hover .dfde-wordmark{transform:scale(1.05)}
.dfde-wordmark strong{font-size:26px;font-weight:800;letter-spacing:-.4px;color:#25232A}
.dfde-wordmark span{font-size:12.5px;color:#6A6371;font-weight:600}
.dfde-cat{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#6A6371}
.dfde-badges{display:flex;flex-wrap:wrap;gap:6px}
.dfde-badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.dfde-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-native{background:#EAF6EF;color:#1B6B43}
.b-datev{background:#EEF7E3;color:#3F6B10}
.b-file{background:#F1EAF3;color:#5A3A52}
.b-api{background:#E9F0FB;color:#1F4E9A}
.b-custom{background:#FFF3DF;color:#7A4D00}
.b-feas{background:#F3F2F5;color:#4E4756;border:1px dashed #B9B1C0}
.dfde-card-desc{margin:0;font-size:14.5px;line-height:1.5;color:#4E4756;max-height:0;opacity:0;transform:translateY(6px);transition:max-height .35s ease,opacity .3s ease,transform .3s ease}
.dfde-card:hover .dfde-card-desc,.dfde-card:focus-visible .dfde-card-desc,.dfde-card.is-on .dfde-card-desc{max-height:140px;opacity:1;transform:none}
.dfde-hint{margin-top:auto;font-size:12.5px;font-weight:600;color:#714B67;transition:opacity .2s}
.dfde-card:hover .dfde-hint{opacity:0}
.dfde-line{position:absolute;left:0;right:0;bottom:0;height:3px;background:#F1EAF3;overflow:hidden}
.dfde-line::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#714B67,#FFCE00,transparent);transform:translateX(-100%)}
.dfde-card:hover .dfde-line::after,.dfde-card:focus-visible .dfde-line::after,.dfde-card.is-on .dfde-line::after{animation:dfde-flow 1.4s linear infinite}
@media (hover: none){
  .dfde-card-desc{max-height:none;opacity:1;transform:none}
  .dfde-hint{display:none}
}

/* diagram */
.dfde-diagram{position:relative;border-radius:28px;padding:30px;background:radial-gradient(ellipse at 50% 40%,#4A3155 0%,#35233F 45%,#25232A 100%);color:#FFFFFF;overflow:hidden;box-shadow:0 40px 80px rgba(53,35,63,.25)}
.dfde-diagram::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(241,234,243,.12) 1px,transparent 1.2px);background-size:22px 22px;pointer-events:none}
.dfde-flows{position:relative;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.dfde-flow{height:36px;padding:0 14px;border-radius:999px;border:1px solid rgba(241,234,243,.25);background:rgba(255,255,255,.05);color:#F1EAF3;font:600 13px Inter,sans-serif;cursor:pointer;transition:background-color .25s,border-color .25s,color .25s}
.dfde-flow:hover{border-color:#F1EAF3}
.dfde-flow.is-on{background:#F1EAF3;color:#35233F;border-color:#F1EAF3}
.dfde-stage{position:relative;width:100%;aspect-ratio:1000 / 600;margin-top:10px}
.dfde-links{position:absolute;inset:0}
.dfde-ln{position:absolute;left:50%;top:50%;height:2px;margin-top:-1px;transform-origin:0 50%;background:rgba(241,234,243,.30);transition:background-color .3s,height .3s,opacity .3s}
.dfde-ln.dash{background:repeating-linear-gradient(90deg,rgba(241,234,243,.45) 0 7px,transparent 7px 14px);background-size:28px 100%;animation:dfde-dashmove 1.2s linear infinite}
@keyframes dfde-dashmove{to{background-position:28px 0}}
.dfde-ln.on{background:#FFCE00;height:3px;box-shadow:0 0 12px rgba(255,206,0,.6)}
.dfde-ln.dim{opacity:.22}
.dfde-pt{position:absolute;top:50%;left:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;box-shadow:0 0 10px currentColor;animation:dfde-travel 2.6s cubic-bezier(.45,0,.55,1) infinite}
.dfde-pt.back{background:#7FB2FF;width:8px;height:8px;margin:-4px 0 0 -4px;animation-name:dfde-travel-back;animation-delay:-1.2s}
.dfde-pt.hide{display:none}
.dfde-pt.dim{opacity:.2}
@keyframes dfde-travel{0%{left:12%;opacity:0}10%{opacity:1}90%{opacity:1}100%{left:100%;opacity:0}}
@keyframes dfde-travel-back{0%{left:100%;opacity:0}10%{opacity:1}90%{opacity:1}100%{left:12%;opacity:0}}
.dfde-core{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#FFFFFF;box-shadow:0 0 0 10px rgba(241,234,243,.10),0 0 0 22px rgba(241,234,243,.05),0 20px 60px rgba(0,0,0,.35);animation:dfde-pulse 2.6s ease-out infinite}
.dfde-core img{width:132px;height:auto}
.dfde-core span{font-size:11px;font-weight:800;letter-spacing:1.6px;color:#714B67}
.dfde-node{position:absolute;transform:translate(-50%,-50%);min-width:120px;height:48px;padding:0 14px;border-radius:14px;border:1px solid rgba(241,234,243,.22);background:rgba(37,35,42,.85);color:#FFFFFF;font:700 14px Inter,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;backdrop-filter:blur(6px);transition:transform .3s cubic-bezier(.2,.7,.2,1),background-color .3s,border-color .3s,box-shadow .3s,opacity .3s}
.dfde-node:hover{transform:translate(-50%,-50%) scale(1.06);border-color:#F1EAF3}
.dfde-node.is-on{background:#F1EAF3;color:#35233F;border-color:#FFCE00;box-shadow:0 0 0 4px rgba(255,206,0,.25)}
.dfde-node.dim{opacity:.35}
.dfde-node i{width:8px;height:8px;border-radius:50%;flex:none}
.dot-native{background:#5BD08E}.dot-file{background:#CFA6C8}.dot-api{background:#7FB2FF}.dot-feas{background:transparent;border:1.5px dashed #F1EAF3}
.dfde-info{position:relative;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;margin-top:18px;padding:22px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(241,234,243,.14)}
.dfde-info h3{margin:0 0 6px;font-size:22px;font-weight:800}
.dfde-info p{margin:0;font-size:15px;line-height:1.55;color:#E6DAE8}
.dfde-info-flows{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.dfde-info-flows span{height:30px;padding:0 12px;border-radius:999px;background:rgba(241,234,243,.12);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;animation:dfde-rise .35s ease both}
.dfde-warn{display:inline-flex;margin-top:12px;padding:8px 12px;border-radius:10px;border:1px dashed rgba(255,206,0,.6);color:#FFE27A;font-size:13px;font-weight:600}
.dfde-legend{position:relative;display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin-top:16px;font-size:13px;color:#E6DAE8}
.dfde-legend span{display:inline-flex;align-items:center;gap:8px}
.dfde-legend i{width:10px;height:10px;border-radius:50%}

/* localization */
.dfde-loc{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:18px}
.dfde-loc-card{position:relative;padding:24px;border-radius:20px;background:#FFFFFF;border:1px solid #ECE3EE;box-shadow:0 6px 18px rgba(53,35,63,.06);transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.dfde-loc-card:hover{transform:translateY(-6px);box-shadow:0 22px 44px rgba(113,75,103,.16)}
.dfde-loc-card::before{content:"";position:absolute;left:24px;right:24px;top:0;height:4px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,#000000 0 33%,#DD0000 33% 66%,#FFCE00 66%);opacity:.85;transform:scaleX(.25);transform-origin:left;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.dfde-loc-card:hover::before{transform:scaleX(1)}
.dfde-loc-ico{width:48px;height:48px;border-radius:14px;background:#F1EAF3;display:flex;align-items:center;justify-content:center;margin-bottom:14px;color:#714B67}
.dfde-loc-card h3{margin:0 0 14px;font-size:19px;font-weight:800;color:#25232A}
.dfde-loc-card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.dfde-loc-card li{display:flex;flex-direction:column;gap:3px;font-size:14.5px;color:#35233F;font-weight:600}
.dfde-loc-card li small{font-size:11.5px;font-weight:700;letter-spacing:.3px}
.t-native{color:#1B6B43}.t-config{color:#5A3A52}.t-custom{color:#7A4D00}.t-ext{color:#1F4E9A}
.dfde-key{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:#4E4756}
.dfde-key span{display:inline-flex;align-items:center;gap:6px;font-weight:600}

/* CTA */
.dfde-cta{position:relative;overflow:hidden;border-radius:28px;padding:48px;background:linear-gradient(120deg,#35233F 0%,#714B67 55%,#8E5C81 100%);background-size:200% 200%;animation:dfde-bg 14s ease infinite;color:#FFFFFF;display:flex;flex-wrap:wrap;gap:36px;align-items:center}
@keyframes dfde-bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.dfde-cta h2{margin:0 0 12px;font-size:36px;line-height:1.12;font-weight:800;letter-spacing:-1px}
.dfde-cta p{margin:0 0 24px;font-size:16.5px;line-height:1.6;color:#F1EAF3}
.dfde-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 28px;border-radius:14px;background:#FFFFFF;color:#35233F;font-weight:800;font-size:16px;text-decoration:none;transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.dfde-btn:hover{color:#35233F;transform:translateY(-3px);box-shadow:0 16px 34px rgba(0,0,0,.25)}
.dfde-btn::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,rgba(113,75,103,.18),transparent);animation:dfde-shine 3.5s ease-in-out infinite}
.dfde-btn svg{transition:transform .3s}
.dfde-btn:hover svg{transform:translateX(5px)}
.dfde-contact{flex:0 1 330px;display:flex;gap:16px;align-items:center;padding:18px;border-radius:20px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18)}
.dfde-contact img{width:76px;height:76px;border-radius:50%;object-fit:cover;object-position:top;flex:none;border:3px solid rgba(255,255,255,.7)}
.dfde-contact a{color:#FFFFFF;text-decoration:none;font-size:14px}
.dfde-contact a:hover{text-decoration:underline;color:#FFFFFF}

@media (max-width: 860px){
  .dfde-h2{font-size:36px}
  .dfde-divider{display:none}
  .dfde-info{grid-template-columns:1fr}
  .dfde-node{min-width:0;height:36px;padding:0 8px;font-size:11px;border-radius:10px}
  .dfde-core{width:110px;height:110px;margin:-55px 0 0 -55px}
  .dfde-core img{width:76px}
  .dfde-cta{padding:28px}
}
@media (prefers-reduced-motion: reduce){
  .dfde *,.dfde *::before,.dfde *::after{animation:none !important;transition:none !important}
}

/* Odoo Gold Partner logo */
.gold-pill{position:relative;overflow:hidden;margin:0;display:inline-flex;align-items:center;gap:12px;background:#FFFFFF;border:1px solid #EEDDEA;border-radius:999px;padding:8px 18px 8px 14px;font-size:14px;font-weight:700;color:#6E2F62;box-shadow:0 6px 20px rgba(160,80,143,.14)}
.gold-pill::after,.gold-chip::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:dfde-shine 4.5s ease-in-out infinite;pointer-events:none}
.gold-chip{position:relative;overflow:hidden;display:inline-flex;align-items:center;padding:6px 10px;border-radius:10px;background:#FFFFFF;animation:dfde-float 5s ease-in-out infinite}
.gold-chip img{height:28px;width:auto;display:block}
/* ===== header: sticky, single line ===== */
.hdr{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid #EEE7EC}
.hdr-in{max-width:1360px;margin:0 auto;padding:14px 28px;display:flex;flex-wrap:nowrap;align-items:center;gap:clamp(16px,2.4vw,40px)}
.hdr-logo{display:flex;flex:none}
.hdr-logo img{height:26px;width:auto;display:block}
.hdr-nav{display:flex;align-items:center;gap:clamp(12px,1.5vw,26px);margin-right:auto;min-width:0;font-size:14.5px;font-weight:500;white-space:nowrap}
.hdr-act{display:flex;align-items:center;gap:10px;flex:none}
.hdr-contact{display:flex;align-items:center;height:44px;padding:0 14px;border-radius:10px;color:#262A36;text-decoration:none;font-size:15px;font-weight:500;white-space:nowrap;transition:background-color .2s}
.hdr-contact:hover{background:#F6EEF4;color:#262A36}
.hdr-cta{display:flex;align-items:center;height:44px;padding:0 20px;border-radius:10px;background:#A0508F;color:#FFFFFF;text-decoration:none;font-weight:600;font-size:15px;white-space:nowrap}
.hdr-cta:hover{color:#FFFFFF}
.hdr-burger{display:none;width:44px;height:44px;border-radius:10px;border:1px solid #E7DCE4;background:#FFFFFF;align-items:center;justify-content:center;cursor:pointer;flex:none}
.hdr-burger-lines{position:relative;width:18px;height:12px;display:block}
.hdr-burger-lines span{position:absolute;left:0;width:100%;height:2px;border-radius:2px;background:#262A36;transition:transform .3s,opacity .2s,top .3s}
.hdr-burger-lines span:nth-child(1){top:0}.hdr-burger-lines span:nth-child(2){top:5px}.hdr-burger-lines span:nth-child(3){top:10px}
.hdr-burger[aria-expanded="true"] .hdr-burger-lines span:nth-child(1){top:5px;transform:rotate(45deg)}
.hdr-burger[aria-expanded="true"] .hdr-burger-lines span:nth-child(2){opacity:0}
.hdr-burger[aria-expanded="true"] .hdr-burger-lines span:nth-child(3){top:5px;transform:rotate(-45deg)}
.hdr-panel{display:flex;flex-direction:column;padding:8px 20px 20px;border-top:1px solid #EEE7EC;animation:menuIn .25s cubic-bezier(.2,.7,.2,1) both}
.hdr-panel a{display:flex;align-items:center;min-height:48px;padding:0 8px;border-radius:10px;color:#262A36;text-decoration:none;font-size:17px;font-weight:600}
.hdr-panel a:hover{background:#F6EEF4;color:#262A36}
.hdr-panel a.hdr-panel-cta{margin-top:10px;justify-content:center;background:#A0508F;color:#FFFFFF}
/* shrink + shadow once the page scrolls */
@supports (animation-timeline: scroll()){
  .hdr{animation:hdrShadow linear both;animation-timeline:scroll(root);animation-range:0 140px}
  .hdr-in{animation:hdrPad linear both;animation-timeline:scroll(root);animation-range:0 140px}
}
@keyframes hdrShadow{to{box-shadow:0 10px 30px rgba(38,42,54,.08);background:rgba(255,255,255,.96)}}
@keyframes hdrPad{to{padding-top:9px;padding-bottom:9px}}
/* keep one line: drop the least important items as the window narrows */
@media (max-width: 1320px){ .hdr-contact{display:none} }
@media (max-width: 1200px){ .hdr-nav a:nth-child(6){display:none} }
@media (max-width: 1100px){ .hdr-nav a:nth-child(5){display:none} .hdr-nav{font-size:14px} }
@media (max-width: 980px){ .hdr-nav{display:none} .hdr-burger{display:flex} .hdr-act{margin-left:auto} }
@media (max-width: 560px){ .hdr-cta{display:none} .hdr-in{padding:12px 16px} .hdr-logo img{height:22px} }
@media (min-width: 981px){ .hdr-panel{display:none} }

/* scroll progress */
.scroll-bar{position:fixed;left:0;top:0;height:3px;width:100%;z-index:60;background:linear-gradient(90deg,#A0508F,#F97243);transform-origin:left;transform:scaleX(0)}
@supports (animation-timeline: scroll()){.scroll-bar{animation:barGrow linear both;animation-timeline:scroll(root)}}
@keyframes barGrow{to{transform:scaleX(1)}}

/* shimmering accent words */
.shimmer-text{background:linear-gradient(100deg,#A0508F 0%,#A0508F 35%,#F97243 50%,#A0508F 65%,#A0508F 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 5s ease-in-out infinite}
.foot .shimmer-text{background-image:linear-gradient(100deg,#CFA6C8 0%,#CFA6C8 35%,#F97243 50%,#CFA6C8 65%,#CFA6C8 100%);font-weight:700}
@keyframes shimmer{0%{background-position:100% 0}60%,100%{background-position:0% 0}}

/* footer */
.foot{position:relative;overflow:hidden;background:#1F1F23;color:#D9DBE1}
.foot-line{position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#A0508F,#F97243,#CFA6C8,#A0508F);background-size:300% 100%;animation:gradient 8s linear infinite}
.f-mail{position:relative;display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:999px;color:#FFFFFF;text-decoration:none;font-weight:600;font-size:15px;isolation:isolate}
.f-mail::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:linear-gradient(90deg,#A0508F,#F97243,#CFA6C8,#A0508F);background-size:300% 100%;animation:gradient 6s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;z-index:-1}
.f-mail:hover{color:#FFFFFF;background:rgba(160,80,143,.25)}
.f-top{position:relative;flex:none;width:120px;height:120px;display:flex;align-items:center;justify-content:center;color:#FFFFFF;text-decoration:none}
.f-top-ring{position:absolute;inset:0;width:100%;height:100%;animation:spin 14s linear infinite}
.f-top:hover .f-top-ring{animation-duration:4s}
.f-top-core{width:58px;height:58px;border-radius:50%;background:#A0508F;display:flex;align-items:center;justify-content:center;transition:transform .3s cubic-bezier(.3,1.6,.5,1),background-color .2s}
.f-top:hover .f-top-core{transform:translateY(-6px) scale(1.08);background:#F97243;color:#1F1F23}
@keyframes spin{to{transform:rotate(360deg)}}
.f-clocks{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 16px;border:1px solid #33363F;border-radius:16px;background:rgba(255,255,255,.03)}
.f-clocks-label{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#CFA6C8;margin-right:6px}
.f-live{position:relative;width:8px;height:8px;border-radius:50%;background:#3DDC84}
.f-live::before{content:"";position:absolute;inset:0;border-radius:50%;background:#3DDC84;animation:pulse 1.8s ease-out infinite}
.f-clock{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#2A2C33;font-size:13.5px;transition:transform .2s,background-color .2s}
.f-clock:hover{transform:translateY(-2px);background:#33363F}
.f-clock strong{color:#FFFFFF;font-variant-numeric:tabular-nums}
.f-city{color:#B9BCC6}
.f-state{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px}
.f-state.open{background:rgba(61,220,132,.15);color:#7BE8AB}
.f-state.closed{background:rgba(255,255,255,.08);color:#B9BCC6}
.f-head{display:flex;align-items:center;gap:8px;margin:0 0 16px;font-size:13px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#CFA6C8}
.f-dot{width:7px;height:7px;border-radius:50%;background:#F97243;animation:bounce 2.4s cubic-bezier(.3,.6,.3,1) infinite}
.f-col:nth-child(2) .f-dot{animation-delay:.2s}.f-col:nth-child(3) .f-dot{animation-delay:.4s}.f-col:nth-child(4) .f-dot{animation-delay:.6s}.f-col:nth-child(5) .f-dot{animation-delay:.8s}.f-col:nth-child(6) .f-dot{animation-delay:1s}
.f-col ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.f-link{position:relative;display:inline-flex;align-items:center;gap:6px;color:#F9A07E;text-decoration:none;font-size:15px;transition:color .2s,transform .25s cubic-bezier(.2,.7,.2,1)}
.f-link svg{opacity:0;transform:translateX(-6px);transition:opacity .2s,transform .25s}
.f-link::after{content:"";position:absolute;left:0;right:20px;bottom:-3px;height:1.5px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.f-link:hover{color:#FFFFFF;transform:translateX(4px)}
.f-link:hover svg{opacity:1;transform:none}
.f-link:hover::after{transform:scaleX(1)}
.f-news{display:flex;flex-wrap:wrap;align-items:center;gap:28px;padding:32px;border-radius:22px;background:linear-gradient(135deg,rgba(160,80,143,.22),rgba(249,114,67,.10));border:1px solid rgba(207,166,200,.18)}
.f-form{display:flex;gap:10px}
.f-input{flex:1;min-width:0;height:52px;border-radius:12px;border:1.5px solid transparent;background:#FFFFFF;color:#262A36;padding:0 16px;font:400 15px Inter,sans-serif;transition:box-shadow .25s,border-color .25s}
.f-input:focus{outline:none;border-color:#F97243;box-shadow:0 0 0 5px rgba(249,114,67,.25)}
.f-sub{position:relative;overflow:hidden;height:52px;padding:0 22px;border:0;border-radius:12px;background:#F97243;color:#1F1F23;font:700 15px Inter,sans-serif;display:flex;align-items:center;gap:10px;cursor:pointer;transition:transform .2s,box-shadow .2s}
.f-sub:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(249,114,67,.35)}
.f-plane{transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.f-sub:hover .f-plane{transform:translate(4px,-4px) rotate(-8deg)}
.f-legal{color:#F9A07E;text-decoration:none;position:relative}
.f-legal:hover{color:#FFFFFF}
.f-gold{display:inline-flex;align-items:center;gap:8px;color:#F3D27A;font-weight:600}
.f-gold-dot{width:10px;height:10px;border-radius:50%;background:#E4A900;box-shadow:0 0 0 0 rgba(228,169,0,.6);animation:goldPulse 2.2s ease-out infinite}
@keyframes goldPulse{0%{box-shadow:0 0 0 0 rgba(228,169,0,.55)}100%{box-shadow:0 0 0 12px rgba(228,169,0,0)}}
.f-giant{position:relative;display:flex;justify-content:center;align-items:baseline;margin-top:40px;font-weight:800;font-size:clamp(64px,15.5vw,230px);line-height:.78;letter-spacing:-.05em;white-space:nowrap;user-select:none;-webkit-text-stroke:1.5px rgba(207,166,200,.35);color:transparent;transform:translateY(12%)}
.f-giant span{-webkit-text-fill-color:transparent;background:linear-gradient(180deg,currentColor,currentColor) no-repeat;-webkit-background-clip:text;background-clip:text;background-size:100% 0%;background-position:bottom;transition:background-size .8s cubic-bezier(.2,.7,.2,1)}
.f-giant-doo{color:#A0508F}.f-giant-dot{color:#F97243}.f-giant-fin{color:#F97243}
.f-giant:hover span{background-size:100% 100%}
@supports (animation-timeline: view()){
  .f-giant span{animation:fillUp linear both;animation-timeline:view();animation-range:entry 10% cover 55%}
  .f-giant-dot{animation-range:entry 20% cover 60%}
  .f-giant-fin{animation-range:entry 25% cover 70%}
}
@keyframes fillUp{from{background-size:100% 0%}to{background-size:100% 100%}}

/* language switcher */
.lang-wrap{position:relative}
.lang-btn{height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:999px;border:2px solid #CFA6C8;background:#FFFFFF;color:#262A36;font:600 14px Inter,sans-serif;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.lang-btn:hover,.lang-btn[aria-expanded="true"]{border-color:#A0508F;box-shadow:0 0 0 4px rgba(160,80,143,.12)}
.lang-caret{transition:transform .25s}
.lang-btn[aria-expanded="true"] .lang-caret{transform:rotate(180deg)}
.lang-menu{position:absolute;right:0;top:calc(100% + 10px);width:330px;background:#FFFFFF;border:1px solid #EEE7EC;border-radius:16px;box-shadow:0 24px 60px rgba(38,42,54,.18);padding:10px;z-index:50;transform-origin:top right;animation:menuIn .25s cubic-bezier(.2,.7,.2,1) both}
@keyframes menuIn{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}
.lang-head{margin:4px 10px 8px;font-size:12px;font-weight:700;letter-spacing:.4px;color:#5F6470;text-transform:uppercase}
.lang-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:10px;padding:2px 6px 2px 2px;opacity:0;animation:rise .35s cubic-bezier(.2,.7,.2,1) forwards}
.lang-row:nth-child(2){animation-delay:.02s}.lang-row:nth-child(3){animation-delay:.04s}.lang-row:nth-child(4){animation-delay:.06s}.lang-row:nth-child(5){animation-delay:.08s}.lang-row:nth-child(6){animation-delay:.1s}.lang-row:nth-child(7){animation-delay:.12s}.lang-row:nth-child(8){animation-delay:.14s}.lang-row:nth-child(9){animation-delay:.16s}.lang-row:nth-child(10){animation-delay:.18s}.lang-row:nth-child(11){animation-delay:.2s}
.lang-row:hover{background:#FBF6FA}
.lang-row.is-current{background:#F4E9F1}
.lang-cty{flex:1;display:flex;align-items:center;gap:12px;min-height:40px;padding:0 10px;border:0;background:transparent;color:#262A36;font:500 15px Inter,sans-serif;text-align:left;cursor:pointer}
.lang-pills{display:flex;gap:4px}
.lang-pill{min-width:36px;height:28px;padding:0 8px;border-radius:999px;border:1px solid #E7DCE4;background:#FFFFFF;color:#4A4F59;font:700 11px Inter,sans-serif;letter-spacing:.4px;cursor:pointer;transition:background-color .2s,color .2s,border-color .2s}
.lang-pill:hover{border-color:#A0508F;color:#8A3F7B}
.lang-pill.is-on{background:#A0508F;border-color:#A0508F;color:#FFFFFF}
.flag-AM{background:linear-gradient(#D90012 0 33.3%,#0033A0 33.3% 66.6%,#F2A800 66.6%)}
.flag-AE{background:linear-gradient(90deg,#FF0000 0 26%,transparent 26%),linear-gradient(#00732F 0 33.3%,#FFFFFF 33.3% 66.6%,#000000 66.6%)}
.flag-GB{background:linear-gradient(90deg,transparent 42%,#C8102E 42% 58%,transparent 58%),linear-gradient(transparent 36%,#C8102E 36% 64%,transparent 64%),linear-gradient(90deg,transparent 36%,#FFFFFF 36% 64%,transparent 64%),linear-gradient(transparent 26%,#FFFFFF 26% 74%,transparent 74%),#012169}

/* national managers */
.chip{height:44px;padding:0 16px;border-radius:999px;font:600 14px Inter,sans-serif;cursor:pointer;transition:background-color .2s,color .2s,transform .2s}
.chip:hover{transform:translateY(-2px)}
.chip-on{border:1px solid #A0508F;background:#A0508F;color:#FFFFFF}
.chip-off{border:1px solid #E7DCE4;background:#FFFFFF;color:#262A36}
.flag{display:inline-block;flex:none;width:18px;height:12px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.flag-LU{background:linear-gradient(#EF3340 0 33.3%,#FFFFFF 33.3% 66.6%,#00A3E0 66.6%)}
.flag-FR{background:linear-gradient(90deg,#0055A4 0 33.3%,#FFFFFF 33.3% 66.6%,#EF4135 66.6%)}
.flag-IT{background:linear-gradient(90deg,#009246 0 33.3%,#FFFFFF 33.3% 66.6%,#CE2B37 66.6%)}
.flag-BE{background:linear-gradient(90deg,#000000 0 33.3%,#FDDA24 33.3% 66.6%,#EF3340 66.6%)}
.flag-NL{background:linear-gradient(#AE1C28 0 33.3%,#FFFFFF 33.3% 66.6%,#21468B 66.6%)}
.flag-DE{background:linear-gradient(#000000 0 33.3%,#DD0000 33.3% 66.6%,#FFCE00 66.6%)}
.flag-US{background:linear-gradient(#3C3B6E,#3C3B6E) top left/45% 54% no-repeat,repeating-linear-gradient(#B22234 0 1.7px,#FFFFFF 1.7px 3.4px)}
.mgr{position:relative;background:#FFFFFF;border:1px solid #EEE7EC;border-radius:18px;overflow:hidden;animation:pop .5s cubic-bezier(.2,.7,.2,1) both;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s ease}
.mgr:hover,.mgr:focus-within{transform:translateY(-6px);box-shadow:0 22px 48px rgba(160,80,143,.22)}
.mgr-photo{position:relative;aspect-ratio:288 / 400;overflow:hidden;background:#F4EEF2}
.mgr-photo img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.mgr:hover .mgr-photo img,.mgr:focus-within .mgr-photo img{transform:scale(1.07)}
.mgr-tag{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);color:#6E2F62;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.5px}
.mgr-tag::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#F97243;margin-right:6px;vertical-align:1px}
.mgr-panel{position:absolute;left:0;right:0;bottom:0;padding:56px 18px 18px;color:#FFFFFF;font-size:13.5px;line-height:1.4;display:flex;flex-direction:column;gap:10px;background:linear-gradient(to top,rgba(94,38,83,.98) 0%,rgba(140,66,124,.95) 62%,rgba(160,80,143,0) 100%);transform:translateY(101%);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.mgr:hover .mgr-panel,.mgr:focus-within .mgr-panel{transform:none}
.mgr-row{display:flex;gap:10px;align-items:flex-start;color:#FFFFFF;text-decoration:none;opacity:0;transform:translateY(12px);transition:opacity .35s ease,transform .35s ease}
.mgr-row svg{flex:none;margin-top:2px}
a.mgr-row:hover span{text-decoration:underline}
.mgr:hover .mgr-row,.mgr:focus-within .mgr-row{opacity:1;transform:none}
.mgr-btn{display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:10px;background:#FFFFFF;color:#8A3F7B;font-weight:700;text-decoration:none;transition:background-color .2s}
.mgr-btn:hover{background:#FBEFF7;color:#6E2F62}
.mgr-sample{font-size:11px;font-weight:600;border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:2px 8px}
@media (hover: none){
  .mgr-panel{position:static;transform:none;padding:16px;background:#8C427C}
  .mgr-row{opacity:1;transform:none}
}

@media (max-width: 1400px){ .hide-md{display:none !important} }
@media (max-width: 760px){
  .hide-sm{display:none !important}
  .hero-h1{font-size:40px !important}
  .sec-h2{font-size:30px !important}
  .float-card{display:none !important}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}

</style>
</head>
<body>
<div id="app"></div>
<template id="page">

<div style="font-family: Inter, system-ui, sans-serif; color: #262A36; width: 100%; min-height: 100vh; background: #FFFFFF; line-height: 1.5; overflow-x: clip">

  <div aria-hidden="true" class="scroll-bar"></div>
  <!-- HEADER: sticky, one line, burger menu on small screens -->
  <header class="hdr" id="site-header">
    <div class="hdr-in">
      <a href="#top" class="hdr-logo" aria-label="doo.FINANCE home"><img src="assets/doo-finance-logo.png" alt="doo.FINANCE"></a>
      <nav aria-label="Main" class="hdr-nav">
        <a href="#services" class="nav-a">{{t.services}}</a>
        <a href="#apps" class="nav-a">{{t.apps}}</a>
        <a href="#industries" class="nav-a">{{t.industries}}</a>
        <a href="#german-ecosystem" class="nav-a">{{t.germany}}</a>
        <a href="#team" class="nav-a">{{t.people}}</a>
        <a href="#insights" class="nav-a">{{t.insights}}</a>
      </nav>
      <div class="hdr-act">
        <a href="#contact" class="hdr-contact">{{t.contact}}</a>
        <a href="#diagnostic" class="hdr-cta shine btn-p">{{t.cta}}</a>
        <!-- Country / language switcher -->
        <div class="lang-wrap">
          <button type="button" class="lang-btn" onClick="{{toggleLang}}" aria-haspopup="true" aria-expanded="{{langExpanded}}" aria-label="Choose country and language">
            <sc-if value="{{isGlobal}}" hint-placeholder-val="{{ true }}">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A0508F" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>
            </sc-if>
            <sc-if value="{{notGlobal}}" hint-placeholder-val="{{ false }}">
              <span aria-hidden="true" class="flag flag-{{curCode}}"></span>
            </sc-if>
            <span class="lang-code">{{curLang}}</span>
            <svg aria-hidden="true" class="lang-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <sc-if value="{{langOpen}}" hint-placeholder-val="{{ false }}">
            <div class="lang-menu" role="menu">
              <p class="lang-head">{{t.choose}}</p>
              <sc-for list="{{sites}}" as="site" hint-placeholder-count="10">
                <div class="lang-row {{site.cls}}">
                  <button type="button" class="lang-cty" onClick="{{site.pick}}" role="menuitem">
                    <sc-if value="{{site.globe}}" hint-placeholder-val="{{ false }}">

ng", "API Integration": "API-integratie", "Custom Integration": "Maatwerkintegratie", "Integration Feasibility Assessment": "Haalbaarheidsonderzoek integratie", "Germany's standard for Steuerberater. Odoo exports postings, partner accounts and document images in DATEV format.": "De Duitse standaard voor Steuerberater. Odoo exporteert boekingen, relatierekeningen en documentbeelden in DATEV-formaat.", "Tax advisor suite (incl. AKTE). Its SMART Connect imports postings in DATEV format, the same files Odoo exports.": "Suite voor belastingadviseurs (incl. AKTE). SMART Connect importeert boekingen in DATEV-formaat, dezelfde bestanden die Odoo exporteert.", "Tax advisor software with a DATEV import assistant that reads DATEV-format files from other systems.": "Software voor belastingadviseurs met een DATEV-importassistent die DATEV-bestanden uit andere systemen inleest.", "Tax advisor software whose posting-data import accepts DATEV-format data.": "Software voor belastingadviseurs waarvan de boekingsimport DATEV-data accepteert.", "Tax and accounting software for tax firms. Exchange with Odoo is assessed per project.": "Belasting- en boekhoudsoftware voor kantoren. Uitwisseling met Odoo wordt per project beoordeeld.", "SME accounting (Lexware Office and desktop). Public REST API and ASCII import, typical for migrations to Odoo.": "Kmo-boekhouding (Lexware Office en desktop). Publieke REST API en ASCII-import, typisch bij migraties naar Odoo.", "Cloud accounting for small businesses with a REST API, often the starting point for a move to Odoo.": "Cloudboekhouding voor kleine bedrijven met een REST API, vaak het vertrekpunt voor een overstap naar Odoo.", "Sage 100 imports and exports DATEV-format (DTVF) files, so postings can move via the DATEV format.": "Sage 100 importeert en exporteert DATEV-bestanden (DTVF), zodat boekingen via het DATEV-formaat kunnen lopen.", "Accounting and controlling software for German mid-sized companies. Interface options are assessed per project.": "Boekhoud- en controllingsoftware voor Duitse middelgrote bedrijven. Koppelopties worden per project beoordeeld.", "Hover for details · click to trace in the diagram": "Beweeg voor details · klik om te volgen in het diagram", "Badges describe the documented exchange route, not a certified or pre-built connector. AKTE (Wolters Kluwer) uses the same DATEV-format import as ADDISON and is covered by that card.": "Badges beschrijven de gedocumenteerde uitwisselingsroute, geen gecertificeerde of kant-en-klare connector. AKTE (Wolters Kluwer) gebruikt dezelfde DATEV-import als ADDISON en valt onder die kaart.", "How data moves": "Hoe data stroomt", "Odoo at the centre of your German finance stack": "Odoo in het hart van uw Duitse financiële stack", "Click a platform or a data flow": "Klik op een platform of datastroom", "Filter by data flow": "Filteren op datastroom", "Accounting Entries": "Boekingen", "Invoices": "Facturen", "Customer & Vendor Data": "Klant- en leveranciersdata", "VAT Information": "Btw-informatie", "Bank Transactions": "Banktransacties", "Payroll Data": "Loongegevens", "DATEV Export Files": "DATEV-exportbestanden", "File-based exchange": "Bestandsuitwisseling", "Custom API integration": "API-integratie op maat", "Integration feasibility assessment": "Haalbaarheidsonderzoek integratie", "Custom Integration / Subject to Technical Validation": "Maatwerkintegratie / onder voorbehoud van technische validatie", "Typical data exchanged": "Typisch uitgewisselde data", "File-based exchange (DATEV format)": "Bestandsuitwisseling (DATEV-formaat)", "Custom integration · subject to technical validation": "Maatwerkintegratie · onder voorbehoud van technische validatie", "Odoo's German localization exports DATEV ATCH (invoice documents) and DATEV DATA (EXTF Buchungsstapel plus partner account files) from the general ledger. Your Steuerberater imports them into DATEV Rechnungswesen. Importing from DATEV into Odoo, and payroll data from DATEV LODAS, are custom work.": "De Duitse lokalisatie van Odoo exporteert DATEV ATCH (factuurdocumenten) en DATEV DATA (EXTF-Buchungsstapel plus relatierekeningbestanden) vanuit het grootboek. Uw Steuerberater importeert ze in DATEV Rechnungswesen. Import van DATEV naar Odoo en loondata uit DATEV LODAS zijn maatwerk.", "ADDISON SMART Connect imports bookings and invoice data in DATEV format (DATEV CSV and DATEV XML). Odoo’s DATEV export is the starting point; field mapping is checked with the tax firm.": "ADDISON SMART Connect importeert boekingen en factuurdata in DATEV-formaat (DATEV CSV en DATEV XML). De DATEV-export van Odoo is het startpunt; de veldmapping wordt met het kantoor gecontroleerd.", "AGENDA's DATEV import assistant reads DATEV-format CSV (and DATEV XML for document data). Odoo provides the DATEV-format files; the exact import profile is agreed with the tax firm.": "De DATEV-importassistent van AGENDA leest CSV in DATEV-formaat (en DATEV XML voor documentdata). Odoo levert de bestanden; het exacte importprofiel wordt met het kantoor afgesproken.", "Simba's Buchungsdatenimport accepts structured document data in DATEV XML format, and Simba can export in DATEV CSV. Odoo exchanges data through the DATEV format.": "De Buchungsdatenimport van Simba accepteert gestructureerde documentdata in DATEV XML, en Simba kan exporteren in DATEV CSV. Odoo wisselt data uit via het DATEV-formaat.", "Stotax can export accounting data for transfer to DATEV. A documented import route for Odoo-generated files has not been verified, so we assess it per project before committing.": "Stotax kan boekhouddata exporteren voor overdracht naar DATEV. Een gedocumenteerde importroute voor Odoo-bestanden is niet geverifieerd; we beoordelen dit per project voordat we iets toezeggen.", "Lexware Office has a public REST API (XL plan) for contacts, invoices, vouchers and payments. Lexware buchhaltung pro imports bookings and Debitoren/Kreditoren via ASCII. There is no native Odoo connector: this is a custom build."     method: 'Diamant is relevant for German mid-market finance teams. We have not verified a specific import or API route for this page, so integration is scoped after a technical assessment.',
    flows: ['Accounting Entries', 'Customer & Vendor Data'] }
];
const DE_KIND = { native: 'Native Odoo export', file: 'File-based exchange', api: 'Custom API integration', feas: 'Integration feasibility assessment' };
const DE_DOT = { native: 'dot-native', file: 'dot-file', api: 'dot-api', feas: 'dot-feas' };
const DE_PT = { native: '#5BD08E', file: '#CFA6C8', api: '#7FB2FF', feas: '#FFE27A' };


const OFFICES = [
  { city: 'New York', code: 'US', tz: 'America/New_York' },
  { city: 'London', code: 'GB', tz: 'Europe/London' },
  { city: 'Paris', code: 'FR', tz: 'Europe/Paris' },
  { city: 'Brussels', code: 'BE', tz: 'Europe/Brussels' },
  { city: 'Luxembourg', code: 'LU', tz: 'Europe/Luxembourg' },
  { city: 'Amsterdam', code: 'NL', tz: 'Europe/Amsterdam' },
  { city: 'Berlin', code: 'DE', tz: 'Europe/Berlin' },
  { city: 'Milan', code: 'IT', tz: 'Europe/Rome' },
  { city: 'Yerevan', code: 'AM', tz: 'Asia/Yerevan' },
  { city: 'Dubai', code: 'AE', tz: 'Asia/Dubai' }
];
function officeClock(o, now) {
  let time = '--:--', open = false;
  try {
    time = new Intl.DateTimeFormat('en-GB', { timeZone: o.tz, hour: '2-digit', minute: '2-digit', hour12: false }).format(now);
    const day = new Intl.DateTimeFormat('en-US', { timeZone: o.tz, weekday: 'short' }).format(now);
    const h = parseInt(time.slice(0, 2), 10);
    const weekend = o.code === 'AE' ? (day === 'Sat' || day === 'Sun') : (day === 'Sat' || day === 'Sun');
    open = !weekend && h >= 9 && h < 18;
  } catch (e) {}
  return { city: o.city, code: o.code, time: time, state: open ? 'Open' : 'Closed', cls: open ? 'open' : 'closed' };
}

const COUNTRIES = ['All', 'Belgium', 'France', 'Germany', 'Italy', 'Luxembourg', 'Netherlands', 'United Kingdom', 'United States'];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { country: 'All', site: 'global', lang: 'EN', langOpen: false, now: Date.now(), app: 'accounting', svc: 'accounting', src: 'datev', ent: 2, cty: 2, yrs: 5, qStep: 0, qAns: [], dsel: 'datev', dflow: '', menuOpen: false };
  }
  componentDidMount() {
    this._tick = setInterval(() => this.setState({ now: Date.now() }), 20000);
  }
  componentWillUnmount() {
    clearInterval(this._tick);
  }
  renderVals() {
    const sel = this.state.country;
    const chips = COUNTRIES.map((c) => {
      const on = c === sel;
      const count = c === 'All' ? MANAGERS.length : MANAGERS.filter((m) => m.countries.indexOf(c) !== -1).length;
      return {
        label: c,
        count: count,
        pressed: on ? 'true' : 'false',
        cls: on ? 'chip-on' : 'chip-off',
        pick: () => this.setState({ country: c })
      };
    });
    const managers = MANAGERS
      .filter((m) => sel === 'All' || m.countries.indexOf(sel) !== -1)
      .map((m) => ({
        name: m.name,
        role: m.role,
        photo: m.photo,
        address: m.address,
        phone: m.phone,
        email: m.email,
        sample: m.sample,
        code: m.flag,
        tel: 'tel:' + m.phone.replace(/\s+/g, ''),
        mailto: 'mailto:' + m.email
      }));
    const appSel = APPS.find((x) => x.id === this.state.app) || APPS[0];
    const apps = APPS.map((x) => ({
      name: x.name, color: x.color, icon: IC[x.icon || x.id],
      cls: x.id === appSel.id ? 'is-on' : '', pressed: x.id === appSel.id ? 'true' : 'false',
      pick: () => { if (this.state.app !== x.id) this.setState({ app: x.id }); }
    }));
    const app = { name: appSel.name, color: appSel.color, icon: IC[appSel.icon || appSel.id], title: appSel.title, points: appSel.points.map((t) => ({ text: t })) };

    const svcTabs = SVC_TABS.map((tb) => ({ label: tb.label, cls: tb.id === this.state.svc ? 'is-on' : '', selected: tb.id === this.state.svc ? 'true' : 'false', pick: () => this.setState({ svc: tb.id }) }));
    const services = SERVICES[this.state.svc].map((x) => ({ name: x.name, desc: x.desc, color: x.color, bg: x.bg, icon: IC[x.icon], kind: this.state.svc === 'partners' ? 'Partners' : (this.state.svc === 'consulting' ? 'Consulting' : 'Accounting'), tags: x.tags.map((t) => ({ t: t })) }));

    const maxBar = Math.max.apply(null, BARS.map((b) => b[1]));
    const bars = BARS.map((b, i) => ({ y: b[0] === '2026' ? '2026*' : b[0], v: b[1], h: Math.round(b[1] / maxBar * 100) + '%', d: (i * 0.07).toFixed(2) + 's', bg: i === BARS.length - 1 ? 'linear-gradient(180deg,#FBC06A,#F97243)' : 'linear-gradient(180deg,#D886B8,#A0508F)' }));
    const barTotal = BARS.reduce((t, b) => t + b[1], 0);
    const C = 2 * Math.PI * 44;
    let acc = 0;
    const donut = DONUT.map((d) => { const len = d[1] / 100 * C; const o = { label: d[0], pct: d[1] + '%', color: d[2], dash: len.toFixed(2) + ' ' + (C - len).toFixed(2), offset: (-acc).toFixed(2) }; acc += len; return o; });
    const maxC = BY_COUNTRY[0][2];
    const byCountry = BY_COUNTRY.map((c, i) => ({ code: c[0], name: c[1], v: c[2], w: Math.round(c[2] / maxC * 100) + '%' }));

    const src = SRCS.find((x) => x.id === this.state.src) || SRCS[0];
    const ent = this.state.ent, cty = this.state.cty, yrs = this.state.yrs;
    const weeks = Math.max(3, Math.round(src.base + 1.2 * (ent - 1) + 0.8 * (cty - 1) + 0.35 * yrs));
    const split = [['Diagnostic & design', 0.15, '#A0508F'], ['Data migration', 0.4, '#F97243'], ['Set-up & tests', 0.3, '#0E9F8E'], ['Go-live & training', 0.15, '#2F6FE4']];
    const est = {
      weeks: weeks, entities: ent, countries: cty, years: yrs, src: src.label,
      phases: split.map((p) => ({ label: p[0], w: p[1], color: p[2], wk: Math.max(1, Math.round(weeks * p[1])) + ' wk' })),
      notes: [
        { t: yrs + (yrs === 1 ? ' year' : ' years') + ' of history moved from ' + src.label },
        { t: cty + (cty === 1 ? ' tax regime' : ' tax regimes') + ' set up by local chartered accountants' },
        { t: ent === 1 ? 'One company, one clean chart of accounts' : 'One chart of accounts across ' + ent + ' entities, consolidation-ready' }
      ]
    };
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const srcs = SRCS.map((x) => ({ label: x.label, cls: x.id === src.id ? 'is-on' : '', pressed: x.id === src.id ? 'true' : 'false', pick: () => this.setState({ src: x.id }) }));

    const industries = INDUSTRIES.map((x, i) => ({ n: '0' + (i + 1), name: x.name, color: x.color, bg: x.bg, desc: x.desc, icons: x.icons.map((k) => ({ src: IC[k] })), tags: x.tags.map((t) => ({ t: t })) }));

    const qStep = this.state.qStep;
    const done = qStep >= QUIZ.length;
    const res = done ? quizResult(this.state.qAns) : null;
    const quiz = {
      asking: !done, done: done, num: Math.min(qStep + 1, 3),
      progress: Math.round(Math.min(qStep, 3) / 3 * 100) + '%',
      q: done ? '' : QUIZ[qStep].q,
      opts: done ? [] : QUIZ[qStep].opts.map((o, i) => ({ label: o, pick: () => this.setState({ qStep: qStep + 1, qAns: this.state.qAns.concat([i]) }) })),
      result: res ? res.result : '', icon: res ? res.icon : '', why: res ? res.why : '',
      reset: () => this.setState({ qStep: 0, qAns: [] })
    };

    const dSelId = this.state.dsel, dFlow = this.state.dflow;
    const dSelP = PLATFORMS.find((p) => p.id === dSelId) || PLATFORMS[0];
    const nP = PLATFORMS.length;
    const geo = PLATFORMS.map((p, i) => {
      const a = (-90 + i * (360 / nP)) * Math.PI / 180;
      return { x: Math.round(500 + 395 * Math.cos(a)), y: Math.round(300 + 235 * Math.sin(a)) };
    });
    const carries = (p) => !dFlow || p.flows.indexOf(dFlow) !== -1;
    const dCards = PLATFORMS.map((p, i) => ({
      name: p.name, vendor: p.vendor, cat: p.cat, desc: p.desc,
      logo: p.logo, hasLogo: !!p.logo, noLogo: !p.logo,
      badges: p.badges.map((b) => ({ label: b[0], cls: b[1] })),
      cls: p.id === dSelId ? 'is-on' : '', pressed: p.id === dSelId ? 'true' : 'false',
      aria: p.name + ': ' + p.badges.map((b) => b[0]).join(', '),
      delay: (i * 0.06).toFixed(2) + 's',
      pick: () => this.setState({ dsel: p.id })
    }));
    const dLinks = PLATFORMS.map((p, i) => {
      const g = geo[i];
      const on = p.id === dSelId;
      const dim = !carries(p);
      const dx = g.x - 500, dy = g.y - 300;
      const len = Math.sqrt(dx * dx + dy * dy);
      return {
        w: (len / 10).toFixed(2) + '%',
        deg: (Math.atan2(dy, dx) * 180 / Math.PI).toFixed(1) + 'deg',
        dur: (2.4 + (i % 3) * 0.5).toFixed(1) + 's', color: DE_PT[p.status],
        backcls: p.status === 'api' ? '' : 'hide',
        cls: [p.status === 'feas' ? 'dash' : '', on ? 'on' : '', dim ? 'dim' : ''].join(' '),
        ptcls: dim ? 'dim' : ''
      };
    });
    const dNodes = PLATFORMS.map((p, i) => ({
      name: p.name, dot: DE_DOT[p.status],
      left: (geo[i].x / 10) + '%', top: (geo[i].y / 6) + '%',
      cls: (p.id === dSelId ? 'is-on' : '') + (carries(p) ? '' : ' dim'),
      pressed: p.id === dSelId ? 'true' : 'false',
      pick: () => this.setState({ dsel: p.id })
    }));
    const dFlows = DE_FLOWS.map((f) => ({
      label: f, cls: f === dFlow ? 'is-on' : '', pressed: f === dFlow ? 'true' : 'false',
      pick: () => this.setState({ dflow: this.state.dflow === f ? '' : f })
    }));
    const site = SITES.find((x) => x.id === this.state.site) || SITES[0];
    const lang = this.state.lang;
    const sites = SITES.map((x) => ({
      name: x.name,
      code: x.code,
      globe: !x.code,
      hasFlag: !!x.code,
      cls: x.id === site.id ? 'is-current' : '',
      pick: () => this.setState({ site: x.id, lang: x.langs[0], langOpen: false }),
      langs: x.langs.map((l) => ({
        code: l,
        aria: x.name + ', ' + LANG_NAMES[l],
        cls: x.id === site.id && l === lang ? 'is-on' : '',
        pick: () => this.setState({ site: x.id, lang: l, langOpen: false })
      }))
    }));
    return {
      chips: chips,
      managers: managers,
      apps: apps, app: app, svcTabs: svcTabs, services: services,
      bars: bars, barTotal: barTotal, donut: donut, byCountry: byCountry,
      srcs: srcs, est: est,
      entUp: () => this.setState({ ent: clamp(ent + 1, 1, 20) }), entDown: () => this.setState({ ent: clamp(ent - 1, 1, 20) }),
      ctyUp: () => this.setState({ cty: clamp(cty + 1, 1, 10) }), ctyDown: () => this.setState({ cty: clamp(cty - 1, 1, 10) }),
      yrsUp: () => this.setState({ yrs: clamp(yrs + 1, 1, 15) }), yrsDown: () => this.setState({ yrs: clamp(yrs - 1, 1, 15) }),
      industries: industries, quiz: quiz,
      menuOpen: this.state.menuOpen, menuExpanded: this.state.menuOpen ? 'true' : 'false',
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }), closeMenu: () => this.setState({ menuOpen: false }),
      dCards: dCards, dLinks: dLinks, dNodes: dNodes, dFlows: dFlows,
      dSel: { name: dSelP.name, method: dSelP.method, kind: DE_KIND[dSelP.status], isFeas: dSelP.status === 'feas', flows: dSelP.flows.map((t) => ({ t: t })) },

      clocks: OFFICES.map((o) => officeClock(o, new Date(this.state.now))),
      t: I18N[lang] || I18N.EN,
      sites: sites,
      langOpen: this.state.langOpen,
      langExpanded: this.state.langOpen ? 'true' : 'false',
      toggleLang: () => this.setState({ langOpen: !this.state.langOpen }),
      isGlobal: !site.code,
      notGlobal: !!site.code,
      curCode: site.code,
      curLang: lang
    };
  }
}

window.__dcApp = mountDC(Component, document.getElementById('app'), document.getElementById('page'));
</script>
